name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dashboard data invariants
        run: python tests/test_data_integrity.py
      - name: Golden-value regression (catches a silently-bad model)
        run: python tests/test_golden.py

  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the 3D app
        run: |
          cd app
          npm ci
          npm run build
